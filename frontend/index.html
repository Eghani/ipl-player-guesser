<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPL AI Guesser</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      integrity="sha384-Wu9MIpIlWQhQcM9CNvHY2yC6wQHqmE5J+QeJ2+JN0bVwjnd5NVX0s0A9CjXQkK89"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.4/font/bootstrap-icons.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main
      class="app-shell d-flex align-items-center justify-content-center min-vh-100 px-3"
    >
      <section class="app-card shadow-lg p-4">
        <header class="app-header text-center mb-4">
          <!-- <div
            class="brand-icon d-inline-flex align-items-center justify-content-center mb-3"
          >
            <i class="bi bi-cricket"></i>
          </div> -->
          <h1 class="h4 mb-1">IPL AI Guesser</h1>
          <p class="text-muted small mb-0">Think of a player. I’ll guess it.</p>
        </header>

        <div
          id="chat"
          class="chat-window mb-3"
          aria-live="polite"
          aria-atomic="false"
        ></div>

        <div class="d-flex gap-3 justify-content-center controls mb-3">
          <button id="yesButton" type="button" class="btn btn-yes flex-fill">
            YES
          </button>
          <button id="noButton" type="button" class="btn btn-no flex-fill">
            NO
          </button>
        </div>

        <button id="startButton" type="button" class="btn btn-start w-100">
          Start Game
        </button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
