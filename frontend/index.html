<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>IPL Guesser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>🏏 IPL Guesser</h1>

    <div id="chat"></div>

    <div class="controls">
      <button onclick="sendAnswer('yes')">YES</button>
      <button onclick="sendAnswer('no')">NO</button>
    </div>

    <button class="start" onclick="startGame()">Start Game</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
